[project]
name = "youtube-crypto"
version = "0.1.0"
description = "YouTube Crypto Agent - Automated video monitoring and LLM analysis for crypto YouTube channels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiomysql>=0.2.0",
    "google-genai>=0.2.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.2.0",
    "PyMySQL>=1.0",
    "python-dotenv>=0.21.0",
    "httpx>=0.28.0",
    "tenacity>=8.2.0",
    "websockets>=13.0.0",
    "protobuf>=3.19.0",
    "fastapi>=0.138.1",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["youtube_crypto", "youtube_crypto.config", "youtube_crypto.jobs", "youtube_crypto.models", "youtube_crypto.repositories", "youtube_crypto.services", "youtube_crypto.utils", "youtube_crypto.web"]

[tool.setuptools.package-dir]
youtube_crypto = "."

[project.scripts]
youtube-crypto = "youtube_crypto.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
